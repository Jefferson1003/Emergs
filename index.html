<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Lumber Estimator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>🌳 Tree Lumber Estimator</h1>

        <!-- Camera Preview -->
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Camera Selector -->
        <div class="section">
            <label>Select Camera</label>
            <select id="cameraSelect"></select>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="startCam" class="btn">🎥 Start Camera</button>
            <button id="toggleDetect" class="btn" disabled>🟢 Start Detection</button>
            <button id="stopCam" class="btn" disabled>⛔ Stop Camera</button>
        </div>

        <!-- Calibration -->
        <div class="calibration-box">
            <h3>🎯 Calibration</h3>
            <input id="refWidth" type="number" min="1" max="200" value="10" step="0.1">
            <button id="calibrateBtn" class="btn small">Calibrate</button>
            <p id="calibrationStatus">Not calibrated</p>
        </div>

        <!-- Results -->
        <div class="result-box">
            <h3>📊 Measured Values</h3>
            <p id="rDiameter">Diameter: -- cm</p>
            <p id="rHeight">Height: -- cm</p>
            <p id="rVolume">Volume: -- cm³</p>
            <p id="rLumber">Lumber Estimate: -- pcs</p>
            <p id="status">Status: Standby</p>
        </div>

    </div>

    <!-- OpenCV -->
    <script async src="https://docs.opencv.org/master/opencv.js"></script>
    <script src="app.js"></script>
</body>
</html>
