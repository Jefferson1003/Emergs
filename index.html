<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Lumber Estimator - Enhanced Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌳 Enhanced Tree Lumber Estimator</h1>
        
        <!-- Camera Section -->
        <div class="camera-container">
            <div class="video-wrapper">
                <video id="videoInput" autoplay playsinline></video>
                <canvas id="canvasOutput"></canvas>
                <div id="detectionOverlay"></div>
            </div>
        </div>
        
        <!-- Camera Selection -->
        <div class="camera-selection">
            <label for="cameraSelect">Select Camera: </label>
            <select id="cameraSelect">
                <option value="environment">Back Camera</option>
                <option value="user">Front Camera</option>
            </select>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="startBtn" class="btn">🎥 Start Camera</button>
            <button id="toggleDetectBtn" class="btn">🟢 Start Real-time</button>
            <button id="stopBtn" class="btn">⏹️ Stop Camera</button>
        </div>
        
        <!-- Calibration -->
        <div class="calibration">
            <h3>🎯 Calibration</h3>
            <div class="calibration-inputs">
                <label>Reference Object Width (cm): </label>
                <input type="number" id="refWidth" value="10.0" step="0.1" min="1" max="100">
                <button id="calibrateBtn" class="btn">Calibrate</button>
            </div>
            <p id="calibrationStatus">Not calibrated</p>
        </div>
        
        <!-- Results -->
        <div class="results">
            <h3>📊 Real-time Results:</h3>
            <div class="result-grid">
                <div class="result-item">
                    <span class="result-label">Diameter:</span>
                    <span id="diameterResult">-- cm</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Height:</span>
                    <span id="heightResult">-- cm</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Volume:</span>
                    <span id="volumeResult">-- cm³</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Weight:</span>
                    <span id="weightResult">-- kg</span>
                </div>
                <div class="result-item highlight">
                    <span class="result-label">Lumber Estimate:</span>
                    <span id="lumberResult">-- pieces</span>
                </div>
            </div>
            <p id="status">Status: Camera off</p>
        </div>

        <!-- Detection Info -->
        <div class="detection-info">
            <h3>🔍 Detection Information</h3>
            <p id="detectionInfo">No tree detected</p>
        </div>
    </div>

    <!-- Include OpenCV.js -->
    <script async src="https://docs.opencv.org/master/opencv.js" onload="onOpenCvReady();"></script>
    <script src="app.js"></script>
</body>
</html>
